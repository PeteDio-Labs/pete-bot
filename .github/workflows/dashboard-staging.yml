# Publishes the dashboard build as a release asset that the staging host pulls (CT 249).
#
# The host runs no branch code: it downloads `dashboard-dist.tar.gz`, checks `dashboard-dist.tar.gz.sha256`, and
# serves the files. `build.json` in the archive names the commit. This job builds on a GitHub-hosted runner with install scripts off, packs `dashboard/dist`
# (fixtures included, so staging reads no lab data), and replaces the two assets on the `dashboard-staging` release.
#
# ⚠ THE LOG SAYS WHAT WAS PACKED. It prints the file count and the checksum, and fails when the build is empty,
# so a release of nothing cannot look like a success.
name: dashboard-staging

on:
  push:
    branches: [dashboard-staging, main]
    paths: ['dashboard/**', '.github/workflows/dashboard-staging.yml']

permissions:
  contents: write

concurrency:
  group: dashboard-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build
        working-directory: dashboard
        env:
          # Unset, the build reads the fixture. Set it to the real feed once its CORS rule is applied (petedio-iac#752).
          DASHBOARD_FEED: ${{ vars.STAGING_DASHBOARD_FEED }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - name: Pack
        run: |
          files=$(find dashboard/dist -type f | wc -l)
          test "$files" -ge 5 || { echo "::error::only $files files in dashboard/dist"; exit 1; }
          # The served site names its commit at /build.json, so a reader can tell which build a host serves.
          printf '{"sha":"%s","builtAt":"%s","run":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" > dashboard/dist/build.json
          tar -czf dashboard-dist.tar.gz -C dashboard/dist .
          sha256sum dashboard-dist.tar.gz > dashboard-dist.tar.gz.sha256
          echo "packed $files files, $(stat -c %s dashboard-dist.tar.gz) bytes"
          cat dashboard-dist.tar.gz.sha256
      - name: Replace the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dashboard-staging >/dev/null 2>&1 || gh release create dashboard-staging --prerelease --target "$GITHUB_SHA" --title "Dashboard staging build" --notes "The latest dashboard build for staging. Replaced on every push to dashboard-staging or main."
          gh release upload dashboard-staging dashboard-dist.tar.gz dashboard-dist.tar.gz.sha256 --clobber
          # The release tag stays on the commit that created it, so the notes name the commit of these assets.
          gh release edit dashboard-staging --notes "The latest dashboard build for staging, built from $GITHUB_SHA. Replaced on every push to dashboard-staging or main. The tag does not move: read the commit here or in build.json inside the archive."
          echo "uploaded 2 assets for $GITHUB_SHA and named it in the release notes"
