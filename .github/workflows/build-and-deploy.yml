# CI — lint, typecheck, test, and compile the artifact the deploy actually ships.
#
# ⚠ IT RUNS `bun run test:run`, NOT `bun test`. This repo is a vitest project — the
# config, the setup file that loads .env.test, and the mocking the suite depends on are
# all vitest's. `bun test` walks the same files with a different runner, ignores
# vitest.setup.ts, and supports none of vi.mock/vi.stubGlobal/vi.resetModules. It
# reported 36 passed for months only because the four surviving tests happened to use no
# vitest feature at all. Two runners that agree by coincidence are one runner that will
# disagree the first time a real test is written, which is exactly what happened.
#
# ⚠ IT NO LONGER PUSHES A DOCKER IMAGE. It pushed to docker.pdlab.dev — registry-106,
# which will not restore — so this workflow failed on EVERY push to main while the
# deploy that matters succeeded beside it. A check that is always red is a check nobody
# reads, and it was burying the lint/typecheck/test signal. The real deploy is
# deploy.yml: it compiles a standalone binary and installs it on media-dash-237. The
# cluster this image was built for is torn down.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

      - name: Build TypeScript
        run: bun run build

      # The deploy compiles this on a homelab runner. Building it here too means a
      # compile break is caught on the PR rather than on the merge that deploys it.
      - name: Compile the standalone binary
        run: |
          bun run build:binary
          test -x dist/pete-bot
