# CI — lint, typecheck, test, and compile the artifact the deploy actually ships.
#
# ⚠ ONE RUNTIME: BUN. Pedro ruled "run everything under bun" (PET-617). The suite runs
# under `bun test` (bunfig.toml loads test.setup.ts), and no Node is set up. The suite
# used to be vitest, which runs under Node, so a test could pass on a module the shipped
# Bun binary did not have. That happened: node:sqlite passed every test and crashed the
# binary at startup. Don't add a second runner back.
#
# ⚠ IT RUNS THE BINARY, NOT ONLY BUILDS IT. scripts/smoke-binary.sh starts the compiled
# binary with the gateway on and checks that it loads, opens its ledger and serves HTTP.
# A binary that builds can still crash on its first import.
#
# ⚠ IT NO LONGER PUSHES A DOCKER IMAGE. It pushed to docker.pdlab.dev — registry-106,
# which will not restore — so this workflow failed on EVERY push to main while the
# deploy that matters succeeded beside it. A check that is always red is a check nobody
# reads, and it was burying the lint/typecheck/test signal. The real deploy is
# deploy.yml: it compiles a standalone binary and installs it on media-dash-237. The
# cluster this image was built for is torn down.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The floor in package.json's engines. deploy.yml builds with `latest`.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build TypeScript
        run: bun run build

      # The deploy compiles this on a homelab runner. Building it here too means a
      # compile break is caught on the PR rather than on the merge that deploys it.
      - name: Compile the standalone binary
        run: |
          bun run build:binary
          test -x dist/pete-bot

      - name: Start the binary
        run: scripts/smoke-binary.sh dist/pete-bot
